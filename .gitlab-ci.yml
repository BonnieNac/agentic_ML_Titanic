variables:
  UV_VERSION: "0.6"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: bookworm-slim
  UV_LINK_MODE: copy # Essentiel : les runners GitLab ne supportent souvent pas les hardlinks entre systèmes de fichiers / layers de conteneurs
  GIT_DEPTH: "1" # Clone superficiel par défaut (perf), surchargé pour les releases

.default_image: &default_image ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: '$CI_COMMIT_TITLE =~ /^chore\(release\): bump/ && $CI_COMMIT_BRANCH'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - test
  - release

# ── Lint + Format ──────────────────────────────────────────────────────────────

python_lint:
  stage: check
  image: *default_image
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - uv run --native-tls --group dev ruff check src/ tests/ app/

python_format:
  stage: check
  image: *default_image
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - uv run --native-tls --group dev ruff format --check src/ tests/ app/

python_typecheck:
  stage: check
  image: *default_image
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - uv run --native-tls --group dev mypy src/ app/

# Audite les dépendances contre les licences restrictives (ex : GPL)
python_license_check:
  stage: check
  image: *default_image
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - uv run --native-tls --group dev pip-licenses --fail-on "GPL;AGPL;LGPL"

# ── Tests unitaires ─────────────────────────────────────────────────────────────

coverage:
  stage: test
  image: *default_image
  timeout: 10 minutes
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    key: uv-cache-$PYTHON_VERSION
    paths:
      - /root/.cache/uv
      - .venv/
    policy: pull-push
  script:
    - uv run --native-tls --group dev pytest
  coverage: "/(?i)total.*? (100(?:\\.0+)?\\%|[1-9]?\\d(?:\\.\\d+)?\\%)$/"
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ── Versioning + changelog (release) ────────────────────────────────────────────
# Nécessite les variables CI CI_GIT_USERNAME / CI_GIT_TOKEN (voir README) pour
# pouvoir pousser les tags de version depuis le pipeline.

release:
  stage: release
  image: *default_image
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_TITLE =~ /^chore\(release\): bump/'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  before_script:
    - apt-get update && apt-get install -y git
    - git remote set-url origin
      "https://${CI_GIT_USERNAME}:${CI_GIT_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin
    - git fetch --tags
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
  script:
    - git config --global user.name "CI Gitlab"
    - git config --global user.email "ci@gitlab.com"
    - uv run cz bump --yes --changelog
    - git push origin "$CI_DEFAULT_BRANCH"
    - git push --tags
  needs:
    - "python_format"
    - "python_lint"
    - coverage
